name: Check public tools and catalogue
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python scripts/build.py
      - run: python scripts/check.py
      - run: node --test tests/catalogue.test.cjs
      - run: node --test tools/offline-record-comparator/tests/comparator.test.cjs
      - run: git diff --exit-code -- docs evidence
